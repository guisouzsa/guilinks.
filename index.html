<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Links</title>
<style>
  :root{
    --bg: #ffffff;
    --fg: #000000;
    --line: #000000;
    --muted: #555555;
    --card-bg: #f5f5f5;
  }
  :root[data-theme="dark"]{
    --bg: #ffffff;
    --fg: #000000;
    --line: #000000;
    --muted: #555555;
    --card-bg: #f5f5f5;
  }

  * { box-sizing: border-box; }

  html, body{
    margin:0;
    background: var(--bg);
    color: var(--fg);
  }

  body{
    font-family: Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  .page{
    width:100%;
    max-width:480px;
    padding: 0 0 56px 0;
  }

  /* Banner full-bleed: ocupa toda a largura da tela, de ponta a ponta */
  .banner{
    width:100vw;
    margin-left: calc(-50vw + 50%);
    aspect-ratio: 16 / 8;
    background: #f2f2f2;
    position:relative;
    overflow:hidden;
  }
  .banner svg, .banner img{
    width:100%;
    height:100%;
    display:block;
    object-fit: cover;
  }

  .content{
    padding: 32px 24px 0 24px;
    text-align:center;
  }

  .phrase{
    font-size: 14px;
    line-height:1.6;
    color: var(--muted);
    margin: 0 auto 30px auto;
    max-width: 320px;
  }

  .phrase.top{
    margin-top: 6px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    height:68px;
    border-radius: 34px;
    border: 1px solid rgba(0,0,0,0.5);
    text-decoration:none;
    color: #ffffff;
    font-weight:600;
    font-size:14px;
    letter-spacing: 0.4px;
    overflow:hidden;
    background: var(--card-bg);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .link-btn:active{
    transform: scale(0.98);
  }

  .link-btn .bg{
    position:absolute;
    inset:0;
    filter: grayscale(1) contrast(1.05);
  }

  .link-btn .bg svg, .link-btn .bg img{
    width:100%;
    height:100%;
    display:block;
    object-fit: cover;
  }

  .link-btn .overlay{
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.5);
  }

  .link-btn .label{
    position:relative;
    z-index:2;
    padding: 0 18px;
  }

  .footer{
    margin-top: 40px;
    text-align:center;
    padding: 0 24px;
  }

  .footer .phrase{
    margin-bottom: 8px;
  }

  .credit{
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.4px;
  }

  .divider{
    width: 32px;
    height: 1px;
    background: var(--line);
    margin: 24px auto;
    opacity: 0.5;
  }
</style>
</head>
<body>
<div class="page">

  <div class="banner">
    <!-- Coloque um arquivo chamado banner.jpg na mesma pasta do index.html -->
    <img src="denji (1).jpeg" alt="Banner" onerror="this.style.display='none'">
  </div>

  <div class="content">
    <p class="phrase top">Bem-vindo(a) ao meu espaço. Aqui estão todos os lugares onde você pode me encontrar.</p>

    <div class="links">
      <a class="link-btn" href="https://open.spotify.com/user/31lcdibstuckgdnjkhbqtt5m4db4?si=cbocu8tjSQ-8jT0FB49kOQ&utm_source=copy-link" target="_blank" rel="noopener">
        <span class="bg"><img src="header.jpeg" alt="Spotify" onerror="this.style.display='none'"></span>
        <span class="overlay"></span>
        <span class="label">Spotify</span>
      </a>

      <a class="link-btn" href="https://www.instagram.com/guilhermesouzsa?stkn=Z2N4dXVlbnJjYXdu" target="_blank" rel="noopener">
        <span class="bg"><img src="☆.jpeg" alt="Instagram" onerror="this.style.display='none'"></span>
        <span class="overlay"></span>
        <span class="label">Instagram</span>
      </a>

      <a class="link-btn" href="https://github.com/guisouzsa" target="_blank" rel="noopener">
        <span class="bg"><img src="352336370831420505.jpeg" alt="GitHub" onerror="this.style.display='none'"></span>
        <span class="overlay"></span>
        <span class="label">GitHub</span>
      </a>

      <a class="link-btn" href="https://boxd.it/efhbH" target="_blank" rel="noopener">
        <span class="bg"><img src="685321268294287881.jpeg" alt="Letterboxd" onerror="this.style.display='none'"></span>
        <span class="overlay"></span>
        <span class="label">Letterboxd</span>
      </a>

      <a class="link-btn" href="https://substack.com/@guisouzsa" target="_blank" rel="noopener">
        <span class="bg"><img src="_ (3).jpeg" alt="Substack" onerror="this.style.display='none'"></span>
        <span class="overlay"></span>
        <span class="label">Substack</span>
      </a>

      <a class="link-btn" href="https://pin.it/6A1C50gmG" target="_blank" rel="noopener">
        <span class="bg"><img src="88209dc5-c104-46ca-8246-26bba45ab803.jpeg" alt="Pinterest" onerror="this.style.display='none'"></span>
        <span class="overlay"></span>
        <span class="label">Pinterest</span>
      </a>

      <a class="link-btn" href="mailto:guilhermerodriguessouzsa@gmail.com" target="_blank" rel="noopener">
        <span class="bg"><img src="428967933239295406.jpeg" alt="E-mail" onerror="this.style.display='none'"></span>
        <span class="overlay"></span>
        <span class="label">E-mail</span>
      </a>
    </div>

    <div class="footer">
      <div class="divider"></div>
      <p class="phrase">Obrigado por passar por aqui. Volte sempre.</p>
      <p class="credit">Desenvolvido por mim.</p>
    </div>
  </div>

</div>
</body>
</html>
