<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meus links</title>
<style>
  :root{
    --bg: #ffffff;
    --fg: #000000;
    --line: #000000;
    --muted: #555555;
    --card-bg: #f5f5f5;
  }
  :root[data-theme="dark"]{
    --bg: #ffffff;
    --fg: #000000;
    --line: #000000;
    --muted: #555555;
    --card-bg: #f5f5f5;
  }

  * { box-sizing: border-box; }

  html, body{
    margin:0;
    background: var(--bg);
    color: var(--fg);
  }

  body{
    font-family: Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  .page{
    width:100%;
    max-width:480px;
    padding: 0 0 56px 0;
  }

  .banner{
    width:100vw;
    margin-left: calc(-50vw + 50%);
    aspect-ratio: 16 / 8;
    background: #f2f2f2;
    position:relative;
    overflow:hidden;
  }
  .banner img{
    width:100%;
    height:100%;
    display:block;
    object-fit: cover;
  }

  .content{
    padding: 32px 24px 0 24px;
    text-align:center;
  }

  .phrase{
    font-size: 14px;
    line-height:1.6;
    color: var(--muted);
    margin: 0 auto 30px auto;
    max-width: 320px;
  }

  .phrase.top{
    margin-top: 6px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    height:68px;
    border-radius: 34px;
    border: 1px solid rgba(0,0,0,0.5);
    text-decoration:none;
    color: #ffffff;
    font-weight:600;
    font-size:14px;
    letter-spacing: 0.4px;
    overflow:hidden;
    background: var(--card-bg);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .link-btn:active{
    transform: scale(0.98);
  }

  .link-btn .bg{
    position:absolute;
    inset:0;
    filter: grayscale(1) contrast(1.05);
  }

  .link-btn .bg img{
    width:100%;
    height:100%;
    display:block;
    object-fit: cover;
  }

  .link-btn .overlay{
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.5);
  }

  .link-btn .label{
    position:relative;
    z-index:2;
    padding: 0 18px;
  }

  .footer{
    margin-top: 40px;
    text-align:center;
    padding: 0 24px;
  }

  .footer .phrase{
    margin-bottom: 8px;
  }

  .credit{
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.4px;
  }

  .divider{
    width: 32px;
    height: 1px;
    background: var(--line);
    margin: 24px auto;
    opacity: 0.5;
  }
</style>
</head>
<body>
<div class="page">

  <div class="banner">
    <!-- o nome do arquivo contém espaços; a codificação evita falhas ao carregar a imagem. -->
    <img src="_%20(2).jpeg" alt="capa principal">
  </div>

  <div class="content">
    <p class="phrase top">bem-vindo(a) ao meu mundo. aqui você encontra meus projetos, meus gostos e os lugares onde me encontro online.</p>

    <div class="links">
      <a class="link-btn" href="https://open.spotify.com/user/31lcdibstuckgdnjkhbqtt5m4db4?si=cbocu8tjSQ-8jT0FB49kOQ&utm_source=copy-link" target="_blank" rel="noopener">
        <span class="bg"><img src="1f31484eb94a802f5d6065b7b059435e.jpg" alt="spotify"></span>
        <span class="overlay"></span>
        <span class="label">spotify</span>
      </a>

      <a class="link-btn" href="https://www.instagram.com/guilhermesouzsa?stkn=Z2N4dXVlbnJjYXdu" target="_blank" rel="noopener">
        <span class="bg"><img src="222dcf89a289b0decd4c85e1cfa42153.jpg" alt="instagram"></span>
        <span class="overlay"></span>
        <span class="label">instagram</span>
      </a>

      <a class="link-btn" href="https://x.com/guisouzsa" target="_blank" rel="noopener">

        <span class="overlay"></span>
        <span class="label">x (twitter)</span>
      </a>

      <a class="link-btn" href="https://github.com/guisouzsa" target="_blank" rel="noopener">
        <span class="bg"><img src="107342ab91192886decced2444db9c2d.jpg" alt="github"></span>
        <span class="overlay"></span>
        <span class="label">github</span>
      </a>

      <a class="link-btn" href="https://boxd.it/efhbH" target="_blank" rel="noopener">

        <span class="label">letterboxd</span>
      </a>

      </a>

      <a class="link-btn" href="https://pin.it/6A1C50gmG" target="_blank" rel="noopener">

        <span class="overlay"></span>

    </div>

    <div class="footer">
      <div class="divider"></div>
      <p class="phrase">obrigado por visitar meu cantinho. volte sempre.</p>

    </div>
  </div>

</div>
</body>
</html>
